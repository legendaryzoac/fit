name: CI

# Every pull request, when it is opened and on each push to it. Deploys
# run the same tests again from deploy.yml once the PR merges.
on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck -w api
      - run: npm run typecheck -w infra
      - run: npm test -w api
      - run: npm test -w web
      - run: npm run lint
      # Typechecks the web app (tsc -b) as well as building it
      - run: npm run build -w web
